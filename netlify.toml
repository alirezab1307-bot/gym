# انتشار فرانت روی Netlify: فقط پوشه public منتشر می‌شود (صفحه‌ی معرفی + پنل).
# بک‌اند (server.js) روی Render اجرا می‌شود و به این فایل ربطی ندارد.
[build]
  publish = "public"

[[redirects]]
  from = "/panel"
  to = "/panel.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/panel.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
